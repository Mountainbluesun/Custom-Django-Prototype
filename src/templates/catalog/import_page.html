{% extends "base.html" %}
{% block title %}Import Products{% endblock %}

{% block content %}
  <h1>Import Products from CSV</h1>

  <p>Please select a comma-separated CSV file with the following columns: name, sku, company_id, threshold.</p>

  <div class="card">
    <form action="{% url 'catalog:import_csv' %}" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="file" name="csv_file" accept=".csv" required />
      <button type="submit">⬆️ Start Import</button>
    </form>
  </div>
{% endblock %}
