{% extends "base.html" %}
{% block title %}Delete a Product{% endblock %}
{% block content %}
  <h1>Delete Product</h1>
  <p>Confirm deletion of <strong>{{ product.name }}</strong> (#{{ product.id }})?</p>
  <form method="post">{% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'catalog:list' %}">Cancel</a>
  </form>
{% endblock %}
