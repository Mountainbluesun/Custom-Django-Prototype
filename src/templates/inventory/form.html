{% extends "base.html" %}
{% block title %}Stock In{% endblock %}
{% block content %}
<h1>Stock In</h1>
<form method="post">{% csrf_token %}
  <label>Product</label><br>
  <select name="product_id" required>
    {% for p in products %}
      <option value="{{ p.id }}">#{{ p.id }} — {{ p.name }} (C{{ p.company_id }})</option>
    {% endfor %}
  </select><br><br>

  <label>Company</label><br>
  <select name="company_id" required>
    {% for c in companies %}
      <option value="{{ c.id }}">#{{ c.id }} — {{ c.name }}</option>
    {% endfor %}
  </select><br><br>

  <label>Quantity</label><br>
  <input type="number" name="qty" min="1" required><br><br>

  <label>Note (optional)</label><br>
  <input name="note"><br><br>

  <button type="submit">Save</button>
  <a href="{% url 'inventory:list' %}">Cancel</a>
</form>
{% endblock %}
