{% extends "base.html" %}
{% block title %}a product{% endblock %}
{% block content %}
<h1>
  {% if mode == "create" %}
    Create
  {% else %}
    Edit
  {% endif %}
  a product
</h1>
  <form method="post">
    {% csrf_token %}
    <label>Name</label><br>
    <input name="name" value="{{ product.name|default_if_none:'' }}" required><br><br>

    <label>SKU</label><br>
    <input name="sku" value="{{ product.sku|default_if_none:'' }}" required><br><br>

    <label>Company</label><br>
    <select name="company_id" required>
      {% for c in companies %}
        <option value="{{ c.id }}" {% if product and product.company_id == c.id %}selected{% endif %}>#{{ c.id }} — {{ c.name }}</option>
      {% endfor %}
    </select><br><br>

    <label>Alert threshold</label><br>
    <input type="number" name="threshold" value="{{ product.threshold|default_if_none:0 }}"><br><br>

    <button type="submit">Save</button>
    <a href="{% url 'catalog:list' %}">Cancel</a>
  </form>
{% endblock %}
