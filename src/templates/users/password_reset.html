{% extends "base.html" %}

{% block content %}
<h2>Reset My Password</h2>
<p>Enter your email address and we'll send you a link to reset your password.</p>

<form method="post">
  {% csrf_token %}
  {{ form.email.label_tag }}<br>
  {{ form.email }}<br><br>
  <button type="submit">Send Link</button>
</form>
{% endblock %}
